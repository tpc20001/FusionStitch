# FusionStitch 雲端打包：推到 main（或在 Actions 頁按 Run workflow）就會在 Windows 雲端電腦上
#  1) 檢查所有程式檔能不能編譯  2) 用 PyInstaller 打包 EXE（外殼）並自我測試（每個程式檔都要載入得了）
#  3) 做出程式更新包、EXE 外殼、完整安裝包、update.json  4) 放到 GitHub Releases（標籤 v<版本>；同一版發過就不重發）
# 要發新版：改 app/core.py 的 APP_VERSION（並在 app/CHANGELOG.json 最上面加一筆）。要換 EXE：改 build/launcher.py 的 LAUNCHER_VERSION。
# 更新檔放哪裡：這個 repo 是 Public → 放在自己的 Releases（程式下載不用密碼）。
#  以後改成 Private：建一個公開的 FusionStitch-Release，Settings → Secrets → Actions 加 RELEASE_TOKEN（只能寫那個 repo 的 token）就會改放那裡。
name: Build FusionStitch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 讀版本
        id: v
        shell: bash
        run: |
          echo "ver=$(python tools/make_release.py --version)" >> $GITHUB_OUTPUT
          echo "launcher=$(python tools/make_release.py --launcher)" >> $GITHUB_OUTPUT
      - name: 決定更新檔放哪個 repo
        id: r
        shell: bash
        env:
          RT: ${{ secrets.RELEASE_TOKEN }}
          RR: ${{ vars.RELEASE_REPO }}
        run: |
          if [ -n "$RT" ]; then echo "repo=${RR:-${{ github.repository_owner }}/FusionStitch-Release}" >> $GITHUB_OUTPUT
          else echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT; fi
      - name: 這版發過了嗎
        id: e
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" --repo "${{ steps.r.outputs.repo }}" >/dev/null 2>&1; then echo "exists=1" >> $GITHUB_OUTPUT; echo "::notice::v${{ steps.v.outputs.ver }} 已經發過了，這次只試打包、不重發（要發新版請改 APP_VERSION）"; else echo "exists=0" >> $GITHUB_OUTPUT; fi
      - name: 裝打包工具
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade pip
          python -m pip install --disable-pip-version-check -q "PySide6>=6.8,<7" "numpy>=1.26,<2.3" "opencv-python-headless>=4.9,<5" "scipy>=1.11" psutil "moderngl>=5.10" glcontext certifi pyinstaller
      - name: 檢查程式檔
        run: python -c "import py_compile,pathlib,json; [py_compile.compile(str(f), doraise=True) for f in list(pathlib.Path('app').glob('*.py'))+list(pathlib.Path('build').glob('*.py'))+list(pathlib.Path('tools').glob('*.py'))]; [json.loads(f.read_text(encoding='utf-8')) for f in pathlib.Path('app').glob('*.json')]; print('all program files OK')"
      - name: 檢查手機網頁的 JavaScript（壞了就不發）
        shell: bash
        run: |
          python -c "import re,sys;sys.path.insert(0,'app');import webpc_page as w;open('page_check.js','w',encoding='utf-8').write(chr(10).join(re.findall(r'<script>(.*?)</script>',w.PAGE,re.S)))"
          node --check page_check.js && echo "phone page JS OK"
      - name: 打包 EXE（外殼）
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FusionStitch --icon "${{ github.workspace }}\app\FusionStitch.ico"
          --paths "${{ github.workspace }}\build" --distpath work/dist --workpath work/build --specpath work
          --collect-submodules PySide6.QtMultimedia --collect-submodules PySide6.QtOpenGL --collect-submodules PySide6.QtOpenGLWidgets
          --collect-all moderngl --collect-all glcontext --collect-data certifi
          --exclude-module tkinter --exclude-module matplotlib
          --hidden-import _deps "${{ github.workspace }}\build\launcher.py"
      - name: 試一下 EXE（模組都在、每個程式檔都載入得了；不開主程式）
        shell: pwsh
        timeout-minutes: 6
        run: |
          $d = "work/dist/FusionStitch"
          Copy-Item -Recurse app "$d/app"
          New-Item -ItemType Directory -Force "$d/tools/ffmpeg" | Out-Null      # (placeholders: the app checks they exist)
          New-Item -ItemType File -Force "$d/tools/ffmpeg/ffmpeg.exe", "$d/tools/ffmpeg/ffprobe.exe" | Out-Null
          $p = Start-Process -FilePath "$d/FusionStitch.exe" -ArgumentList "--launcher-selftest" -PassThru
          $ok = $p.WaitForExit(240000)
          if (Test-Path "$d/selftest_step.txt") { Get-Content "$d/selftest_step.txt" | Select-Object -Last 5 }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "EXE 自我測試 4 分鐘沒結束" }
          if (-not (Test-Path "$d/selftest.json")) { throw "EXE 自我測試沒有寫出結果（exit $($p.ExitCode)）" }
          Get-Content "$d/selftest.json"
          $code = $p.ExitCode
          foreach ($x in @("app", "selftest_pkg", "LOG", "UPDATE", "Package", "tools")) { if (Test-Path "$d/$x") { Remove-Item -Recurse -Force "$d/$x" } }
          foreach ($x in @("selftest.json", "selftest_step.txt")) { if (Test-Path "$d/$x") { Remove-Item -Force "$d/$x" } }
          if ($code -ne 0) { throw "EXE 自我測試沒過（exit $code）" }
      - name: 用使用者現在的 EXE 試新程式（只熱更新、不換 EXE：新程式在舊 EXE 上跑不起來就不發）
        shell: pwsh
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ steps.v.outputs.launcher }}" -ne "3") { throw "LAUNCHER_VERSION 不能改（使用者決定只熱更新、不換 EXE）" }
          $u = "work/userexe"
          gh release download v2.19.3 --repo "${{ github.repository }}" --pattern "FS_Shell_L3.zip" --dir work --clobber
          Expand-Archive -LiteralPath work/FS_Shell_L3.zip -DestinationPath $u -Force
          Copy-Item -Recurse app "$u/app"
          New-Item -ItemType Directory -Force "$u/tools/ffmpeg" | Out-Null
          New-Item -ItemType File -Force "$u/tools/ffmpeg/ffmpeg.exe", "$u/tools/ffmpeg/ffprobe.exe" | Out-Null
          $p = Start-Process -FilePath "$u/FusionStitch.exe" -ArgumentList "--launcher-selftest" -PassThru
          $ok = $p.WaitForExit(300000)
          if (Test-Path "$u/selftest_step.txt") { Get-Content "$u/selftest_step.txt" | Select-Object -Last 5 }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "舊 EXE 自我測試 5 分鐘沒結束" }
          if (-not (Test-Path "$u/selftest.json")) { throw "舊 EXE 自我測試沒有寫出結果（exit $($p.ExitCode)）" }
          Get-Content "$u/selftest.json"
          if ($p.ExitCode -ne 0) { throw "新程式在使用者現在的 EXE（第 3 版）上跑不起來：用到 EXE 裡沒有的東西了，請改用已有的模組" }
      - name: 做更新包和 update.json
        run: python tools/make_release.py --dist work/dist/FusionStitch --out out --repo "${{ steps.r.outputs.repo }}"
      - uses: actions/upload-artifact@v4
        with: { name: 'FusionStitch-V${{ steps.v.outputs.ver }}', path: out/ }
      - name: 放到 Releases
        if: github.ref == 'refs/heads/main' && steps.e.outputs.exists == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.ver }}" out/FS_V*_Update.zip out/FS_Shell_L*.zip out/FusionStitch_Full_V*.zip out/update.json \
            --repo "${{ steps.r.outputs.repo }}" --title "FusionStitch V${{ steps.v.outputs.ver }}" --notes-file out/notes.md --latest
