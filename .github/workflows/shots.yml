# 開發用：電腦版每一頁截圖（在雲端 Windows 跑，不碰使用者電腦）。Actions 頁按 Run workflow，或 gh workflow run shots.yml
name: PC screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --disable-pip-version-check -q "PySide6>=6.8,<7" "numpy>=1.26,<2.3" "opencv-python-headless>=4.9,<5" "scipy>=1.11" psutil "moderngl>=5.10" glcontext certifi
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/ffmpeg | Out-Null
          New-Item -ItemType File -Force tools/ffmpeg/ffmpeg.exe, tools/ffmpeg/ffprobe.exe | Out-Null
      - shell: pwsh
        timeout-minutes: 6
        run: python tools/shots.py
      - name: 放到 dev-shots（預先發行版，不是最新版，不影響程式更新）
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-shots --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create dev-shots --repo "${{ github.repository }}" --prerelease --latest=false --title "dev shots（開發用截圖）" --notes "開發用：電腦版介面截圖，不是程式版本"
          ls shots
          gh release upload dev-shots shots/*.png --clobber --repo "${{ github.repository }}"
